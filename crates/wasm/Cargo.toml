[package]
name = "peerchat-wasm"
version = "0.1.0"
edition = "2021"
authors = ["HushChat Contributors"]
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for HushChat core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
peerchat-core = { path = "../core" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
zeroize = "1.8"

[dev-dependencies]
wasm-bindgen-test = "0.3"

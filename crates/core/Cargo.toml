[package]
name = "peerchat-core"
version = "0.1.0"
edition = "2021"
authors = ["PeerChat Contributors"]
license = "MIT OR Apache-2.0"
description = "Core cryptography, identity, envelope, protocol, ordering, and backfill logic for PeerChat"

[dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core", "serde", "zeroize"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "serde", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
blake3 = { version = "1.5", default-features = false, features = ["serde"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_bytes = "0.11"
serde-big-array = "0.5"
ciborium = "0.2"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
thiserror = "2.0"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = "1.5"

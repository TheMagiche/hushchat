name: Release Tauri App

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            targets: 'wasm32-unknown-unknown, x86_64-apple-darwin, aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            targets: 'wasm32-unknown-unknown'
          - platform: 'windows-latest'
            args: ''
            targets: 'wasm32-unknown-unknown'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install wasm-pack
        shell: bash
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Rust WASM Core
        shell: bash
        run: |
          chmod +x ./scripts/build-wasm.sh
          ./scripts/build-wasm.sh

      # === FIX: Regenerates a valid multi-resolution icon.ico for the Windows Compiler ===
      - name: Regenerate Tauri Icons
        run: npx @tauri-apps/cli icon ./src-tauri/icons/icon.png


      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUILD: 'true'
          BASE_PATH: ''
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'HushChat v__VERSION__'
          releaseBody: 'HushChat native desktop release.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

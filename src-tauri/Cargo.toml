[package]
name = "hushchat-tauri"
version = "0.1.0"
edition = "2021"
authors = ["HushChat Contributors"]
license = "MIT OR Apache-2.0"
description = "Tauri backend for HushChat"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
peerchat-core = { path = "../crates/core" }
tauri = { version = "2.1", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
